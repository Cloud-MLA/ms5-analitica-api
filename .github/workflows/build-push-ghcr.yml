# BE-TX-05 — Construir y publicar la imagen en GHCR al hacer push de un tag vX.Y
# Copiar a tu repo como .github/workflows/build-push-ghcr.yml
# Imagen resultante: ghcr.io/cloud-mla/<repo>:<tag>  (+ :latest desde la rama por defecto)

name: build-push-ghcr

on:
  push:
    tags: ["v*.*"]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La imagen queda privada por defecto. Hacerla pública una vez:
      # GitHub → org Cloud-MLA → Packages → <repo> → Package settings → Change visibility → Public
