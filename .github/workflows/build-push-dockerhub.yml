# BE-TX-05 — Construir y publicar la imagen en Docker Hub al hacer push de un tag vX.Y
# Copiar a tu repo como .github/workflows/build-push-dockerhub.yml
# Imagen resultante: btoroled/<repo>:<tag>  (+ :latest desde la rama por defecto)
#
# Requiere 2 secrets en el repo (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  → tu usuario de Docker Hub
#   DOCKERHUB_TOKEN     → Access Token de Docker Hub (Account Settings → Security → New Access Token)

name: build-push-dockerhub

on:
  push:
    tags: ["v*.*"]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: btoroled/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El repo en Docker Hub queda público por defecto al crearse desde el primer push
      # (a diferencia de GHCR, no hay que cambiar visibilidad manualmente).
